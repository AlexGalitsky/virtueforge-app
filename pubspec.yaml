name: virtue_forge
description: "VirtueForge"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Специальный SDK-пакет
    sdk: flutter
  intl: ^0.20.2 # Базовый пакет для форматирования дат/чисел
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  go_router_builder: ^4.4.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  reactive_forms: ^17.0.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_slidable: ^4.0.3
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  wakelock_plus: ^1.7.0
  file_selector: ^1.1.0
  llamadart: ^0.8.17
  crypto: ^3.0.6
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  go_router_builder: any
  build_verify: any
  freezed: ^3.2.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/essays.json
    - assets/library/index.json
    - assets/library/ru/
    - assets/library/en/
    - assets/quotes/en.json.gz
    - assets/quotes/ru.json.gz
    - assets/icon.png
    - assets/images/temple/pillar_base.png
    - assets/images/temple/pillar_shattered.png
    - assets/images/temple/pillar_cracks.png
    - assets/legal/NOTICE.txt

  fonts:
    # 1. Интерфейсный шрифт без засечек
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic

    # 2. Книжный шрифт с засечками для заголовков и цитат
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon.png"